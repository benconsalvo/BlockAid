<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlockAid</title>
  
  <!-- External CSS Link -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Konva Canvas Library -->
  <script src="https://unpkg.com/konva@9/konva.min.js"></script>
</head>
<body>

  <!-- MAIN MENU VIEW -->
  <div id="view-main-menu" class="main-menu-container">
    <div class="menu-header">
      <h1>BlockAid</h1>
      <button id="btn-open-settings" class="btn-icon">⚙ Settings</button>
    </div>

    <!-- Blueprints Box -->
    <div class="section-box">
      <div class="section-title-row">
        <h2>Blueprints</h2>
        <button id="btn-create-blueprint" class="btn-primary">+ New Blueprint</button>
      </div>
      <ul id="blueprints-list" class="item-list">
        <li class="empty-message">Loading blueprints...</li>
      </ul>
    </div>

    <!-- Saved Blockings Box -->
    <div class="section-box">
      <div class="section-title-row">
        <h2>Saved Blockings</h2>
      </div>
      <ul id="recordings-list" class="item-list">
        <li class="empty-message">Loading saved blockings...</li>
      </ul>
    </div>
  </div>

  <!-- EDITING BLUEPRINT CANVAS VIEW -->
  <div id="view-blueprint-canvas" class="canvas-screen-container" style="display: none;">
    
    <!-- Top Ribbon -->
    <div class="top-ribbon">
      <div class="ribbon-group-left">
        <button id="btn-bp-main-menu" class="btn-secondary">Main Menu</button>
        <button id="btn-bp-save" class="btn-primary btn-save">
          Save <span id="save-dirty-dot" class="dirty-dot" style="display: none;">●</span>
        </button>
        <button id="btn-bp-undo" class="btn-icon" title="Undo">↩ Undo</button>
        <button id="btn-bp-redo" class="btn-icon" title="Redo">↪ Redo</button>
      </div>

      <!-- Center Drawing Tools -->
      <div class="ribbon-group-center">
        <button id="tool-freehand" class="btn-tool active">✏ Freehand</button>
        <button id="tool-line" class="btn-tool">📏 Line</button>
        <button id="tool-box" class="btn-tool">🔲 Box</button>
        <button id="tool-circle" class="btn-tool">⭕ Circle</button>
      </div>
    </div>

    <!-- Middle Working Area -->
    <div class="canvas-workspace">
      <!-- Left Floor Ribbon -->
      <div class="left-floor-ribbon">
        <span class="floor-title">Floors</span>
        <div id="floors-list" class="floors-list"></div>
        <button id="btn-add-floor" class="btn-secondary">+ Add Level</button>
      </div>

      <!-- Interactive Canvas Container -->
      <div id="konva-holder" class="konva-holder"></div>
    </div>

    <!-- Bottom Stage Direction Bar -->
    <div class="bottom-direction-bar">
      <span>AUDIENCE</span>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div id="settings-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h2 style="color: var(--color-gold); margin-top: 0;">GitHub Settings</h2>
      
      <label for="gh-owner">GitHub Username / Org:</label>
      <input type="text" id="gh-owner" placeholder="e.g. username">

      <label for="gh-repo">Repository Name:</label>
      <input type="text" id="gh-repo" placeholder="e.g. BlockAid">

      <label for="gh-token">Personal Access Token (PAT):</label>
      <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">

      <button id="btn-save-settings" class="btn-primary" style="width: 100%; margin-top: 20px;">
        Save & Test Connection
      </button>
      <button id="btn-close-settings" class="btn-secondary" style="width: 100%; margin-top: 8px;">
        Close
      </button>
      <div id="status-message" style="margin-top: 16px; text-align: center;"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
