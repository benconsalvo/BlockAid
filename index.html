<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Disable viewport zooming for iPad touch responsiveness -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Block Aid</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Startup Screen / Blueprint Manager (Primary View on Launch) -->
  <div id="blueprint-modal" class="modal">
    <div class="modal-content">
      <h2>Block Aid — Select Stage Blueprint</h2>
      <p>Choose an existing theatre blueprint to enter Blocking Mode, or create a new blueprint to enter Drawing Mode.</p>
      
      <div id="blueprint-list" class="modal-list">
        <!-- Dynamically populated with existing blueprints -->
      </div>

      <div class="modal-actions">
        <input type="text" id="new-blueprint-name" placeholder="New Stage Blueprint Name...">
        <button id="btn-create-blueprint">+ Create New Blueprint</button>
      </div>
    </div>
  </div>

  <!-- Workspace Container (Hidden on Startup until a selection is made) -->
  <div id="workspace" class="hidden">

    <!-- Top Navigation Ribbon -->
    <header id="top-ribbon">
      <div class="brand">Block Aid</div>
      
      <!-- Undo / Redo Controls -->
      <div class="ribbon-group">
        <button id="btn-undo" title="Undo (Ctrl+Z)">↶ Undo</button>
        <button id="btn-redo" title="Redo (Ctrl+Y)">↷ Redo</button>
      </div>

      <!-- Mode Toggle & Change Blueprint -->
      <div class="ribbon-group">
        <button id="btn-mode-blueprint" class="active">Edit Blueprint</button>
        <button id="btn-mode-blocking">Blocking Mode</button>
        <button id="btn-switch-blueprint">📁 Change Blueprint</button>
      </div>

      <!-- Blueprint Tools Selector (Visible in Blueprint / Drawing Mode) -->
      <div class="ribbon-group" id="blueprint-tools">
        <button class="tool-btn active" data-tool="line">Straight Line</button>
        <button class="tool-btn" data-tool="freehand">Freehand</button>
        <button class="tool-btn" data-tool="rect">Box</button>
        <button class="tool-btn" data-tool="circle">Circle</button>
        <button class="tool-btn eraser" data-tool="eraser">🧹 Eraser</button>
      </div>

      <!-- Recording Controls (Visible in Blocking Mode) -->
      <div class="ribbon-group hidden" id="blocking-tools">
        <select id="select-recording">
          <option value="">-- Select Take --</option>
        </select>
        <button id="btn-save-take">Save Take</button>
        <button id="btn-add-person">+ Person</button>
        <button id="btn-record">● Record</button>
        <button id="btn-play">▶ Play</button>
        <button id="btn-pause">❚❚ Pause</button>
        <button id="btn-add-note">+ Note</button>
      </div>
    </header>

    <!-- Note Display Banner -->
    <div id="note-banner" class="hidden">
      <span id="note-text">Note: Tap screen to resume playback...</span>
    </div>

    <!-- Main Application Canvas Viewport -->
    <main id="app-container">
      <!-- Left Sidebar for Floor Selector -->
      <aside id="floor-sidebar">
        <h3>Levels</h3>
        <div id="floor-list"></div>
        <button id="btn-add-floor">+ Add Floor</button>
      </aside>

      <!-- Stage Canvas Area -->
      <section id="canvas-container">
        <canvas id="stageCanvas"></canvas>
      </section>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
