<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlockAid - Main Menu</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Main Menu Box -->
  <div class="main-menu-container">
    <div class="menu-header">
      <h1>BlockAid</h1>
      <button id="btn-open-settings" class="btn-icon">⚙ Settings</button>
    </div>

    <!-- Blueprints Box -->
    <div class="section-box">
      <div class="section-title-row">
        <h2>Blueprints</h2>
        <button id="btn-create-blueprint" class="btn-primary">+ New Blueprint</button>
      </div>
      <ul id="blueprints-list" class="item-list">
        <li class="empty-message">Loading blueprints...</li>
      </ul>
    </div>

    <!-- Saved Blockings Box -->
    <div class="section-box">
      <div class="section-title-row">
        <h2>Saved Blockings</h2>
      </div>
      <ul id="recordings-list" class="item-list">
        <li class="empty-message">Loading saved blockings...</li>
      </ul>
    </div>
  </div>

  <!-- Settings Modal (Hidden by Default) -->
  <div id="settings-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h2 style="color: var(--color-gold); margin-top: 0;">GitHub Settings</h2>
      
      <label for="gh-owner">GitHub Username / Org:</label>
      <input type="text" id="gh-owner" placeholder="e.g. username">

      <label for="gh-repo">Repository Name:</label>
      <input type="text" id="gh-repo" placeholder="e.g. BlockAid">

      <label for="gh-token">Personal Access Token (PAT):</label>
      <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx">

      <button id="btn-save-settings" class="btn-primary" style="width: 100%; margin-top: 20px;">
        Save & Test Connection
      </button>
      <button id="btn-close-settings" class="btn-secondary" style="width: 100%; margin-top: 8px;">
        Close
      </button>
      <div id="status-message" style="margin-top: 16px; text-align: center;"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
